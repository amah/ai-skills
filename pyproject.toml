[project]
name = "ai-skills"
version = "0.1.0"
description = "Author AI skills once, ship to Claude Code, OpenCode, Roo Code, and Codex CLI."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
